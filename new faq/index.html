<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Faq</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;   
            gap: 50px;
            align-items: center;
            justify-content: center;
            background-color: #f1f1ff;
            padding-top: 50px;
        }

        .main-title {
            font-size: 3rem;
            color: #252525;
            font-weight: 600;
            text-align: center;
        }

        .faq-items {
            max-width: 750px;
            width: 100%;
            min-height: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .faq-item {
            width: 100%;
            min-height: 100px;
            border-radius: 15px;
            border: 1px solid #ccc;
            transition: all 0.3s linear;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: start;
            justify-content: center;
            padding: 20px;
        }

        .faq-item.active {
            height: 150px;
            background-color: #fff;
        }

        .faq-item .answer.active {
            height: 100px;
        }

        .faq-item .head {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .faq-item .head .title {
            font-size: 22px;
            font-weight: 600;
            color: #252525;
        }

        .faq-item .head i {
            font-size: 20px;
            display: inline-block;
            width: 40px;
            height: 40px;
            background-color: #ccc;
            color: #252525;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .faq-item .answer {
            font-size: 1.25rem;
            color: #252525;
            font-weight: 400;
            margin-top: 20px;
            display: none;
        }

        .faq-item.active .answer {
            display: block;
        }
    </style>
</head>
<body>
    <div class="main-title">Frequently Asked Questions</div>
    <div class="faq-items" id="faq-items">
        
    </div>

    <script src="./app.js"></script>
</body>
</html>
